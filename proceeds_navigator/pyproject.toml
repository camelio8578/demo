[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "proceeds-navigator"
version = "1.0.0"
description = "California excess proceeds monitoring and claimant assistance platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    "playwright>=1.44.0",
    "jinja2>=3.1.4",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "structlog>=24.2.0",
    "python-dateutil>=2.9.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "aiofiles>=23.2.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "respx>=0.21.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-pyyaml>=6.0.12",
    "types-beautifulsoup4>=4.12.0",
    "types-python-dateutil>=2.9.0",
]

[project.scripts]
proceeds-navigator = "proceeds_navigator.cli.commands:app"

[tool.setuptools.packages.find]
where = [".."]
include = ["proceeds_navigator*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["../tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
